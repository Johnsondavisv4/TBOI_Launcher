name: Build Project and Upload Release

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Setup Version
      id: version
      shell: powershell
      run: |
        $version = (Get-Content ${{github.workspace}}/version.txt -Raw).Trim()
        echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Configure CMake
      run: cmake -G "Visual Studio 17 2022" -A "Win32" -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Create Artifact Folder
      shell: powershell
      run: |
        cd ${{github.workspace}}/build/Release
        mkdir artifact
        mv TBOI_Launcher.exe artifact
        mv data.bin artifact
        mv steam_appid.txt artifact
        Compress-Archive -Path artifact/* -Destination TBOI_Launcher.zip
        $PSDefaultParameterValues['*:Encoding'] = 'Default'
        $OutputEncoding = [System.Text.Utf8Encoding]::new($false)
        Get-FileHash .\TBOI_Launcher.zip | Select-Object -ExpandProperty Hash > hash.txt

    - name: Upload release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "${{github.workspace}}/build/Release/TBOI_Launcher.zip,${{github.workspace}}/build/Release/hash.txt"
        tag: ${{steps.version.outputs.version}}
        token: ${{ secrets.GITHUB_TOKEN }}
