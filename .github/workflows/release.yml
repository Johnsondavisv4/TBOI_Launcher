name: Build Project and Upload Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Setup Version
      id: version
      shell: powershell
      run: |
        $version = (Get-Content ${{github.workspace}}/version.txt -Raw).Trim()
        echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -A Win32 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      run: ctest --test-dir ${{github.workspace}}/build -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Create Artifact Folder
      shell: powershell
      run: |
        cd ${{github.workspace}}/build/Release
        mkdir artifact
        mv TBOI_Launcher.exe artifact
        mv data.bin artifact
        mv steam_appid.txt artifact
        Compress-Archive -Path artifact/* -Destination TBOI_Launcher.zip
        $PSDefaultParameterValues['*:Encoding'] = 'Default'
        $OutputEncoding = [System.Text.Utf8Encoding]::new($false)
        Get-FileHash .\TBOI_Launcher.zip | Select-Object -ExpandProperty Hash > hash.txt

    - name: Delete all previous releases and tags
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        $ErrorActionPreference = 'Stop'
        $releaseIds = @(gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[].id')
        if ($LASTEXITCODE -ne 0) { throw 'Could not list previous releases' }
        $tags = @(gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[].name')
        if ($LASTEXITCODE -ne 0) { throw 'Could not list previous tags' }

        foreach ($releaseId in $releaseIds) {
          gh api --method DELETE "repos/$env:GH_REPO/releases/$releaseId" --silent
          if ($LASTEXITCODE -ne 0) { throw "Could not delete release $releaseId" }
        }
        foreach ($tag in $tags) {
          $encodedTag = [Uri]::EscapeDataString($tag)
          gh api --method DELETE "repos/$env:GH_REPO/git/refs/tags/$encodedTag" --silent
          if ($LASTEXITCODE -ne 0) { throw "Could not delete tag $tag" }
        }

    - name: Upload release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "${{github.workspace}}/build/Release/TBOI_Launcher.zip,${{github.workspace}}/build/Release/hash.txt"
        tag: ${{steps.version.outputs.version}}
        commit: ${{ github.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
